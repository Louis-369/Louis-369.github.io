      <stop offset="0%" stop-color="#0D0F14"/>
      <stop offset="50%" stop-color="#13161F"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="spectrumBar" x1="200" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
