      <text x="70" y="112" text-anchor="middle" font-family="monospace" font-size="14" fill="#F59E0B">329.6 Hz</text>
      <text x="70" y="160" text-anchor="middle" font-family="monospace" font-size="12" fill="#9CA3AF">REVEAL #03</text>
