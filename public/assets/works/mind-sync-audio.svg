  <!-- Continuous Harmonic Sine Envelope Curve -->
  <path d="M 140 560 Q 260 490, 380 540 T 620 480 T 860 430 T 1060 390" stroke="url(#waveGrad)" stroke-width="3" fill="none"/>

  <!-- Footer -->
  <g font-family="monospace" font-size="13" fill="#9CA3AF" letter-spacing="1.5">
