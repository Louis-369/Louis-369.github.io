    <g transform="translate(190, 145)">
      <rect width="140" height="225" rx="8" fill="#1E222D" stroke="#D4AF37" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="70" y="65" text-anchor="middle" font-family="serif" font-size="36" fill="#FAF7F0" font-weight="700">商</text>
