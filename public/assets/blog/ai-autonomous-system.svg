<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="editorialPaper" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F5EF"/>
      <stop offset="100%" stop-color="#ECE8DF"/>
    </linearGradient>
  </defs>

  <!-- Base Ivory Canvas -->
  <rect width="1200" height="630" fill="url(#editorialPaper)"/>
  <rect x="36" y="36" width="1128" height="558" rx="10" stroke="#121316" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- Subtle Swiss Grid -->
  <g stroke="#121316" stroke-opacity="0.06" stroke-width="1">
    <line x1="36" y1="110" x2="1164" y2="110"/>
    <line x1="36" y1="520" x2="1164" y2="520"/>
    <line x1="600" y1="110" x2="600" y2="520" stroke-dasharray="4 6"/>
  </g>

  <!-- Top Editorial Bar -->
  <g font-family="monospace" font-size="14" fill="#5A564F" letter-spacing="2">
    <text x="72" y="80" fill="#121316" font-weight="700">[ COMPUTE // SOLO BUSINESS ]</text>
    <text x="1128" y="80" text-anchor="end">AUTONOMOUS CLOSED-LOOP ARCHITECTURE</text>
  </g>

  <!-- Central Autonomous Loop Diagram -->
  <!-- Outer Orbit Ring -->
  <ellipse cx="600" cy="315" rx="330" ry="135" stroke="#121316" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="6 6"/>
  <ellipse cx="600" cy="315" rx="220" ry="82" stroke="#121316" stroke-width="2"/>

  <!-- Center Core: SHARED VAULT MEMORY -->
  <g transform="translate(490, 273)">
    <rect width="220" height="84" rx="8" fill="#121316"/>
    <text x="110" y="36" text-anchor="middle" font-family="monospace" font-size="11" fill="#D4AF37" letter-spacing="2">SINGLE SOURCE OF TRUTH</text>
    <text x="110" y="60" text-anchor="middle" font-family="serif" font-size="20" fill="#F9F8F5" font-weight="700">共用記憶庫 · Vault</text>
  </g>

  <!-- Node 1: Top (GOAL DECOMPOSITION) -->
  <g transform="translate(495, 134)">
    <rect width="210" height="58" rx="29" fill="#FFFFFF" stroke="#121316" stroke-width="1.8"/>
    <text x="105" y="25" text-anchor="middle" font-family="monospace" font-size="10" fill="#6E6A63" letter-spacing="1.5">01. INTENT</text>
    <text x="105" y="44" text-anchor="middle" font-family="serif" font-size="15" fill="#121316" font-weight="700">目標拆解與決策樹</text>
  </g>

  <!-- Node 2: Right (AGENT EXECUTION) -->
  <g transform="translate(835, 286)">
    <rect width="210" height="58" rx="29" fill="#FFFFFF" stroke="#121316" stroke-width="1.8"/>
    <text x="105" y="25" text-anchor="middle" font-family="monospace" font-size="10" fill="#6E6A63" letter-spacing="1.5">02. TOOL CALLS</text>
    <text x="105" y="44" text-anchor="middle" font-family="serif" font-size="15" fill="#121316" font-weight="700">多 Agent 自主調度</text>
  </g>

  <!-- Node 3: Bottom (SELF-VERIFICATION) -->
  <g transform="translate(495, 438)">
    <rect width="210" height="58" rx="29" fill="#FFFFFF" stroke="#121316" stroke-width="1.8"/>
    <text x="105" y="25" text-anchor="middle" font-family="monospace" font-size="10" fill="#6E6A63" letter-spacing="1.5">03. GUARDRAILS</text>
    <text x="105" y="44" text-anchor="middle" font-family="serif" font-size="15" fill="#121316" font-weight="700">自動測試與閉環驗證</text>
  </g>

  <!-- Node 4: Left (DISTILLATION) -->
  <g transform="translate(155, 286)">
    <rect width="210" height="58" rx="29" fill="#FFFFFF" stroke="#121316" stroke-width="1.8"/>
    <text x="105" y="25" text-anchor="middle" font-family="monospace" font-size="10" fill="#6E6A63" letter-spacing="1.5">04. MEMORY</text>
    <text x="105" y="44" text-anchor="middle" font-family="serif" font-size="15" fill="#121316" font-weight="700">經驗沉澱與長期資產</text>
  </g>

  <!-- Bottom Editorial Footer -->
  <g font-family="monospace" font-size="13" fill="#5A564F" letter-spacing="1.5">
    <text x="72" y="562">FIG 01. FROM PROMPT-RESPONSE TO AUTONOMOUS CLOSED-LOOP</text>
    <text x="1128" y="562" text-anchor="end" fill="#121316" font-weight="700">Louis. Editorial</text>
  </g>
</svg>
